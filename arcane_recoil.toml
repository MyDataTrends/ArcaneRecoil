# cosmetic explosions duplicated from vanilla (EXPL DATA: force at 24, damage at 28, radius at 32). v1.2 (2026-10-18,
# user: "more of a POP! instead of an ongoing explosion", worst on wards): impact-sized sources instead of full
# fireball/rune explosions and the Nightingale shockwave (TG08IrkngthandMercerShockwave.nif, its radius patch only
# changed the damage area, not the visual).
[[copy]]
edid = "ArcaneRecoil_FireExplosion"
from = "FireballStormImpactExplosion"
patch = [{ sub = "DATA", offset = 24, float = 0.0 }, { sub = "DATA", offset = 28, float = 0.0 }]
[[copy]]
edid = "ArcaneRecoil_FrostExplosion"
from = "crExplosionFrostSM"
patch = [{ sub = "DATA", offset = 24, float = 0.0 }, { sub = "DATA", offset = 28, float = 0.0 }]
[[copy]]
edid = "ArcaneRecoil_ShockExplosion"
from = "ChainLightningExplosion"
patch = [{ sub = "DATA", offset = 24, float = 0.0 }, { sub = "DATA", offset = 28, float = 0.0 }]
[[copy]]
edid = "ArcaneRecoil_ArcaneExplosion"
from = "ExplosionIllusionLight01"
patch = [{ sub = "DATA", offset = 24, float = 0.0 }, { sub = "DATA", offset = 28, float = 0.0 }]
[[copy]]
edid = "ArcaneRecoil_DarkExplosion"
from = "ExplosionIllusionDark01"
late = true   # new in v1.2: ID after every existing record (the compiled DLL and saves keep theirs)
patch = [{ sub = "DATA", offset = 24, float = 0.0 }, { sub = "DATA", offset = 28, float = 0.0 }]

# brief white flash (Alduin's explosion flash, 0.25 s -> 0.15 s)
[[copy]]
edid = "ArcaneRecoil_FlashISM"
from = "alduinExplosionFlashImod"
patch = [{ sub = "DNAM", offset = 4, float = 0.15 }]

# the VFX script's Sound property: a sound marker pointing at vanilla's ward-break descriptor (until a custom .wav)
[[record]]
type = "SOUN"
edid = "ArcaneRecoil_Detonation"
subs = [{ sig = "OBND", hex = "000000000000000000000000" }, { sig = "SDSC", ref = "MAGWardTestBreakSD" }]

# AoE + fire rider; magnitude set when cast. Delivery Target Actor (3): an Aimed spell cast immediately
# launches a projectile instead of applying (2026-10-15: the wolf's health never moved with Aimed)
[[record]]
type = "SPEL"
edid = "ArcaneRecoil_BurstFire"
subs = [{ sig = "OBND", hex = "000000000000000000000000" }, { sig = "FULL", zstr = "Arcane Recoil: Fire" },
        { sig = "MDOB", hex = "64e20400" }, { sig = "ETYP", hex = "443f0100" }, { sig = "SPIT", hex = "000000000100000000000000000000000100000003000000000000000000000000000000" },
        { sig = "EFID", ref = "FireDamageFFAimed" }, { sig = "EFIT", hex = "0000803f0000000000000000" }]

