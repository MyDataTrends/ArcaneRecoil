        { sig = "EFID", ref = "ArmorFFSelf0" }, { sig = "EFIT", hex = "0000a041000000000a000000" }]

# MCM: MCM Helper page (MCM/Config/ArcaneRecoil/config.json, written by build.py), script is a stub
[[quest]]
edid = "ArcaneRecoil_MCMQuest"
name = "Arcane Recoil MCM"
script = "ArcaneRecoil_MCM"

# VFX: listens for the DLL's "ArcaneRecoil_VFX" mod event; the player alias re-registers on every game load
[[quest]]
edid = "ArcaneRecoil_VFXQuest"
name = "Arcane Recoil VFX"
script = "ArcaneRecoil_VFX"
player_alias_script = "ArcaneRecoil_VFXAlias"
