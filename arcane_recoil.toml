# Arcane Recoil v1.1: the plugin as data (agent/modgen.py). Build everything with: python -I dev/SpellShield/build.py
# The DLL finds records through plugin/src/FormIDs.h (written by this build) and the settings by editor id.
[plugin]
name = "ArcaneRecoil.esp"
folder = "Lalaland-lab - Arcane Recoil"
masters = ["Skyrim.esm"]
light = true
author = "BigQuinn"
cpp_header = "plugin/src/FormIDs.h"

[[global]]
edid = "ArcaneRecoil_Enabled"
value = 1.0

[[global]]
edid = "ArcaneRecoil_LeftHandOnly"
value = 1.0

